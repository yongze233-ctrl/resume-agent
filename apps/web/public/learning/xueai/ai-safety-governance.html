:root {
  /* ── 布局（与主题无关） ── */
  --content-w: 880px;       /* 常规文章宽度 */
  --content-w-wide: 1100px; /* 宽内容（大图表/分栏）宽度 */

/* ── 浅色（默认） ──
   主色由蓝改墨绿，与外壳 learn.html 的 --accent 同值。
   语义色（danger/amber/success/cyan/purple）只用于正文里的图表和标记，
   不进 UI 骨架，所以保持原样，只在深色下换一档亮度。 */
:root, [data-theme="light"] {
  --bg: #f7f5f0;            /* 页面米白底 */
  --bg-dim: #f8f9fa;
  --card: #ffffff;          /* 卡片白底 */
  --card-2: #fbfaf7;        /* 次级面（表头、代码块底） */
  --text: #1c1c1e;          /* 主文字 */
  --sub: #6b7280;           /* 次要文字 */
  --faint: #9aa19d;         /* 三级文字 */
  --accent: #146b54;        /* 主题墨绿 */
  --accent-soft: #e9f2ee;   /* 主色淡底 */
  --danger: #dc2626;
  --amber: #d97706;
  --success: #16a34a;
  --cyan: #0891b2;
  --purple: #7c3aed;
  --border: rgba(0,0,0,0.07);
  --hover: rgba(0,0,0,0.045);
  --code-bg: rgba(0,0,0,0.05);
  --scroll-thumb: rgba(0,0,0,0.15);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-pop: 0 8px 30px rgba(0,0,0,0.10);
  color-scheme: light;
}

/* ── 深色 ──
   同一套语义变量换值，组件规则一行都不用改。
   底色带一点绿味（而不是纯中性灰），跟墨绿主色是同一支色的延伸。
   语义色统一提亮并降饱和：深底上原来的 #dc2626 这类会显得脏且刺眼。 */
[data-theme="dark"] {
  --bg: #101512;
  --bg-dim: #1b221e;
  --card: #171d19;
  --card-2: #1b221e;
  --text: #e9ece9;
  --sub: #a3ada8;
  --faint: #6f7975;
  --accent: #5cb595;
  --accent-soft: rgba(92,181,149,0.14);
  --danger: #e98d7b;
  --amber: #d9a45f;
  --success: #5cb595;
  --cyan: #5bb6c9;
  --purple: #a892d6;
  --border: rgba(255,255,255,0.10);
  --hover: rgba(255,255,255,0.06);
  --code-bg: rgba(255,255,255,0.08);
  --scroll-thumb: rgba(255,255,255,0.18);

  --shadow-pop: 0 8px 30px rgba(0,0,0,0.50);
  color-scheme: dark;
}

  text-transform: uppercase; color: var(--accent); margin-bottom: 10px;

.lesson-header h1 {
  font-size: 32px; font-weight: 800; line-height: 1.35; color: var(--text);

  font-size: 15px; color: var(--sub); margin-top: 10px; line-height: 1.7;

.sec-label {
  font-size: 12px; font-weight: 800; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--sub);
  margin: 36px 0 14px;

}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── 通用卡片 ── */
.l-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-card);
}

/* ── 强调框（引言/结论） ── */
.l-callout {
  background: color-mix(in srgb, var(--accent) 6%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--accent) 24%, transparent);
  border-radius: var(--radius);
  padding: 18px 22px;
}
.l-callout b { color: var(--accent); }

/* ── 渐入动画（逐步展示的元素统一用 .reveal + .show） ── */
.reveal {
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.reveal.show { opacity: 1; transform: translateY(0); }

/* ── 底部悬浮"下一步"按钮 ── */
.fab-wrap {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center;
  padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 55%, transparent);
  pointer-events: none; z-index: 50;
}
.fab-wrap .btn-next {
  pointer-events: auto;
  background: var(--accent); color: #fff; border: none;
  padding: 13px 34px; border-radius: 999px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  font-family: inherit;
}
.fab-wrap .btn-next:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 42%, transparent); }
.fab-wrap .btn-next:active { transform: translateY(0); }
.fab-wrap .btn-next:disabled { background: #c4c8cf; cursor: not-allowed; box-shadow: none; transform: none; filter: none; }
.fab-wrap.hidden { display: none; }

/* ── 双列网格（桌面双列 / 移动单列） ── */
.l-cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}

/* ── 代码 / mono 文本 ── */
.l-mono, code, pre {
  font-family: "SF Mono", "Fira Code", Menlo, monospace;
}
code {

/* ── 历史课页的深色兼容层 ──
   这些类在大量课程中反复出现，但各页曾把浅色面板写死在自己的 <style> 里。
   这里只在 dark 下接管“容器底色和正文色”，保留红/绿等语义，不改变图表含义。 */

function renderCards(filter) {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  ITEMS.forEach((s,i) => {
    const card = document.createElement('div');
    card.className = 'scene-card' + (i===0?' active':'');
    card.dataset.cat = s.cat;
    if (filter !== 'all' && s.cat !== filter) card.classList.add('hidden');
    card.innerHTML = `
      <div class="sc-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800">${s.icon}</div>
      <div class="sc-body">
        <div class="sc-title">${s.title}</div>
        <div class="sc-desc">${s.desc}</div>
        <span class="sc-risk" style="background:${s.riskBg};color:${s.riskColor}">${s.riskText}</span>
      </div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      showDetail(i);
    };
    list.appendChild(card);
  });
}

function showDetail(idx) {
  const s = ITEMS[idx];
  const d = s.detail;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-hd">
      <div class="detail-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800;font-size:18px">${s.icon}</div>
      <div>
        <div class="detail-title">${s.title.split(' — ')[0]}</div>
        <div class="detail-risk" style="color:${d.titleColor}">${s.riskText}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">核心说明</div>
      <div class="ic-body">${d.desc}</div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">${s.cat==='tier'?'管控要求':'核心职责'}</div>
      <div class="ic-list">${d.controls.map(c=>`<div class="ic-item"><div class="ic-dot" style="background:${c.color}"></div><span>${c.text}</span></div>`).join('')}</div>
    </div>
    <div class="do-dont">
      <div class="dd-col dd-do">
        <strong>应该这样做</strong>
        ${d.doList.map(x => '· ' + x).join('<br>')}
      </div>
      <div class="dd-col dd-dont">
        <strong>不要这样做</strong>
        ${d.dontList.map(x => '· ' + x).join('<br>')}
      </div>
    </div>
    <div class="tip-strip" style="background:${d.tip.bg};border:1px solid ${d.tip.bg.replace('.06','.15')};color:${d.tip.color}">
      ${d.tip.text}
    </div>
  `;
}

function filterBy(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.scene-card').forEach(card => {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  const firstVisible = document.querySelector('.scene-card:not(.hidden)');
  if (firstVisible) firstVisible.click();
}

renderCards('all');
showDetail(0);
