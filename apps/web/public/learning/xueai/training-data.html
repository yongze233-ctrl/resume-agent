<style>/* ═══════════════════════════════════════════════════════════
   lesson.css —— 课程子页统一设计系统
   所有课程页面（文章式布局）共享此文件。

:root {
  /* ── 布局（与主题无关） ── */
  --content-w: 880px;       /* 常规文章宽度 */
  --content-w-wide: 1100px; /* 宽内容（大图表/分栏）宽度 */
  --radius: 14px;
  --radius-sm: 10px;
}

/* ── 浅色（默认） ──
   主色由蓝改墨绿，与外壳 learn.html 的 --accent 同值。
   语义色（danger/amber/success/cyan/purple）只用于正文里的图表和标记，
   不进 UI 骨架，所以保持原样，只在深色下换一档亮度。 */
:root, [data-theme="light"] {
  --bg: #f7f5f0;            /* 页面米白底 */
  --bg-dim: #f8f9fa;
  --card: #ffffff;          /* 卡片白底 */
  --card-2: #fbfaf7;        /* 次级面（表头、代码块底） */
  --text: #1c1c1e;          /* 主文字 */
  --sub: #6b7280;           /* 次要文字 */
  --faint: #9aa19d;         /* 三级文字 */
  --accent: #146b54;        /* 主题墨绿 */
  --accent-soft: #e9f2ee;   /* 主色淡底 */
  --danger: #dc2626;
  --amber: #d97706;
  --success: #16a34a;
  --cyan: #0891b2;
  --purple: #7c3aed;
  --border: rgba(0,0,0,0.07);
  --hover: rgba(0,0,0,0.045);
  --code-bg: rgba(0,0,0,0.05);
  --scroll-thumb: rgba(0,0,0,0.15);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-pop: 0 8px 30px rgba(0,0,0,0.10);
  color-scheme: light;
}

/* ── 深色 ──
   同一套语义变量换值，组件规则一行都不用改。
   底色带一点绿味（而不是纯中性灰），跟墨绿主色是同一支色的延伸。
   语义色统一提亮并降饱和：深底上原来的 #dc2626 这类会显得脏且刺眼。 */
[data-theme="dark"] {
  --bg: #101512;
  --bg-dim: #1b221e;
  --card: #171d19;
  --card-2: #1b221e;
  --text: #e9ece9;
  --sub: #a3ada8;
  --faint: #6f7975;
  --accent: #5cb595;
  --accent-soft: rgba(92,181,149,0.14);
  --danger: #e98d7b;
  --amber: #d9a45f;
  --success: #5cb595;
  --cyan: #5bb6c9;
  --purple: #a892d6;
  --border: rgba(255,255,255,0.10);
  --hover: rgba(255,255,255,0.06);
  --code-bg: rgba(255,255,255,0.08);
  --scroll-thumb: rgba(255,255,255,0.18);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.30);
  --shadow-pop: 0 8px 30px rgba(0,0,0,0.50);
  color-scheme: dark;
}

[data-theme="dark"] .qr-bar{

[data-theme="dark"] .qr-bar .qr-close{color:#e4b86f;}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {

  color: var(--text);

.lesson {
  max-width: var(--content-w);
  margin: 0 auto;

.lesson.wide { max-width: var(--content-w-wide); }

/* ── 页头 ── */
.lesson-header { margin-bottom: 36px; }
.lesson-header .kicker {
  font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
}
.lesson-header h1 {
  font-size: 32px; font-weight: 800; line-height: 1.35; color: var(--text);
}
.lesson-header .subtitle {
  font-size: 15px; color: var(--sub); margin-top: 10px; line-height: 1.7;
}

/* ── 章节小标题（贯穿全文的分节） ── */
.sec-label {
  font-size: 12px; font-weight: 800; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--sub);
  margin: 36px 0 14px;
  display: flex; align-items: center; gap: 10px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── 通用卡片 ── */
.l-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-card);
}

/* ── 强调框（引言/结论） ── */
.l-callout {
  background: color-mix(in srgb, var(--accent) 6%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--accent) 24%, transparent);
  border-radius: var(--radius);
  padding: 18px 22px;
}
.l-callout b { color: var(--accent); }

/* ── 渐入动画（逐步展示的元素统一用 .reveal + .show） ── */
.reveal {
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.reveal.show { opacity: 1; transform: translateY(0); }

/* ── 底部悬浮"下一步"按钮 ── */
.fab-wrap {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center;
  padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 55%, transparent);
  pointer-events: none; z-index: 50;
}
.fab-wrap .btn-next {
  pointer-events: auto;
  background: var(--accent); color: #fff; border: none;
  padding: 13px 34px; border-radius: 999px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  font-family: inherit;
}
.fab-wrap .btn-next:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 42%, transparent); }
.fab-wrap .btn-next:active { transform: translateY(0); }
.fab-wrap .btn-next:disabled { background: #c4c8cf; cursor: not-allowed; box-shadow: none; transform: none; filter: none; }
.fab-wrap.hidden { display: none; }

/* ── 双列网格（桌面双列 / 移动单列） ── */
.l-cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}

/* ── 代码 / mono 文本 ── */
.l-mono, code, pre {
  font-family: "SF Mono", "Fira Code", Menlo, monospace;
}
code {
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 1px 6px; border-radius: 5px;
  color: var(--accent);
}

/* ── 历史课页的深色兼容层 ──
   这些类在大量课程中反复出现，但各页曾把浅色面板写死在自己的 <style> 里。
   这里只在 dark 下接管“容器底色和正文色”，保留红/绿等语义，不改变图表含义。 */
[data-theme="dark"] .lesson :is(
  .takeaway-box,
  .qa-answer,
  .xa-tldr,
  .key-box,
  .summary-box,
  .conclusion-box
){
  background:var(--accent-soft) !important;
  border-color:color-mix(in srgb,var(--accent) 34%,transparent) !important;
}

  .takeaway-box,
  .qa-answer,
  .xa-tldr,
  .key-box,
  .summary-box,
  .conclusion-box
) :is(h2,h3,h4,b,strong){
  color:var(--accent) !important;
}
[data-theme="dark"] .lesson :is(
  .takeaway-box,
  .qa-answer,
  .xa-tldr,
  .key-box,
  .summary-box,
  .conclusion-box
) :is(p,li){
  color:var(--text) !important;
}

[data-theme="dark"] .lesson :is(.warn-card,.danger-box,.warning-box){
  background:color-mix(in srgb,var(--danger) 10%,var(--card)) !important;
  border-color:color-mix(in srgb,var(--danger) 38%,transparent) !important;
}
[data-theme="dark"] .lesson :is(.warn-card,.danger-box,.warning-box) :is(h2,h3,h4,b,strong){
  color:var(--danger) !important;
}
[data-theme="dark"] .lesson :is(.warn-card,.danger-box,.warning-box) :is(p,li){

}

[data-theme="dark"] .lesson .col-bad{
  background:color-mix(in srgb,var(--danger) 10%,var(--card)) !important;
  color:var(--danger) !important;
}
[data-theme="dark"] .lesson .col-good{
  background:color-mix(in srgb,var(--success) 10%,var(--card)) !important;
  color:var(--success) !important;
}
[data-theme="dark"] .lesson .col-label{
  background:var(--card-2) !important;
  color:var(--sub) !important;
}

/* 原生表单控件和代码面板也跟随主题；页面自己声明的语义色仍可覆盖。 */
[data-theme="dark"] .lesson :is(input,textarea,select){
  color:var(--text);
  background-color:var(--card);
  border-color:var(--border);
}

}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }

<style>

}

.right-panels {
  display: flex; flex-direction: column; gap: 14px; margin-top: 14px;
}

/* 规模感受卡 */
.vis-box {
  background: var(--card); border-radius: var(--radius);
  border: 1.5px solid var(--border);
  padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;

}

}

}
.scale-bar-fill {

.model-card {

  badge.style.color = bc.text;

  /* 规模感受（右上小卡）

  const prev = +v > 0 ? SCALES[+v - 1] : null;

  document.getElementById('visAnalogy').innerHTML =
    s.analogy + `<div class="sub">${s.sub}</div>`
    + (sameTier ? `<div class="sub tier-same">训练数据量和上一档同级，这一跳变的是参数量</div>` : '');

  grid.innerHTML = '';

    const span = document.createElement('span');
    span.className = 'icon-unit';
    span.textContent = s.icon;
    grid.appendChild(span);
    setTimeout(() => span.classList.add('in'), i * 15);
  }

  // 实测大卡（右下）
  const card = document.getElementById('modelCard');
  card.className = 'model-card ' + VERDICT_CLASS[s.verdict];

  document.getElementById('cardSize').textContent    = s.num;
  document.getElementById('cardName').textContent    = s.modelName;
  document.getElementById('cardTag').textContent     = s.modelTag;
  document.getElementById('cardVerdict').textContent = s.verdictLabel;
  document.getElementById('cardAnswer').innerHTML    = s.answer;
  document.getElementById('cardTip').innerHTML       = s.tip;
}
