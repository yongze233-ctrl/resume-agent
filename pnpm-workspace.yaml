packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false

minimumReleaseAgeExclude:
  - '@magic-resume-kit/*'

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver

packageExtensions:
  'better-call@1.4.4':
    dependencies:
      zod: ^4.5.4

overrides:
  '@react-pdf/layout': 4.6.1
  '@react-pdf/render': 4.5.1
  '@react-pdf/textkit': 6.3.0

patchedDependencies:
  '@magic-resume-kit/resume-templates@1.0.1': patches/@magic-resume-kit__resume-templates@1.0.1.patch
  '@react-pdf/layout@4.6.1': patches/@react-pdf__layout@4.6.1.patch
  '@react-pdf/render@4.5.1': patches/@react-pdf__render@4.5.1.patch
  '@react-pdf/textkit@6.3.0': patches/@react-pdf__textkit@6.3.0.patch
  langchain@1.5.10: patches/langchain@1.5.10.patch
